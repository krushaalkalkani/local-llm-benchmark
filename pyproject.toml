[project]
name = "local-llm-assistant"
version = "0.1.0"
description = "Offline local AI assistant + small-model benchmark study"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.4.0",
    "typer>=0.15.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "psutil>=6.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
]

[project.scripts]
assistant = "assistant.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.hatch.build.targets.wheel.sources]
"src/assistant" = "assistant"

[tool.uv]
package = true
